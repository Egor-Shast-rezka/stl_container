name: Start test and build

on:
  push:
    branches:
      - main
      - Add_Main_Programm
      - Add_Test

  pull_request:
    branches:
      - main
      - Add_Main_Programm
      - Add_Test


jobs:
  test:
    name: Run C++ tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install g++ cmake libgtest-dev
          sudo apt install libeigen3-dev

      - name: Build and run tests
        run: |
          make test
          make clean

  build:
    name: build all project
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install g++ cmake libgtest-dev
          sudo apt install libeigen3-dev

      - name: Build project
        run: |
          make
          make clean
